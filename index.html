<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل 🤝</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    :root {
      --bg: #0f1b2b; --bg-elev: #1e2f44; --bg-card: #1a2c42;
      --border: #2a3b4f; --text: #fff; --text-dim: #8fa3b8;
      --primary: #2563eb; --primary-hover: #1d4ed8;
      --my-msg: #2563eb; --other-msg: #1e2f44;
      --online: #22c55e; --offline: #ef4444;
    }
    body.light {
      --bg: #eef2f7; --bg-elev: #fff; --bg-card: #fff;
      --border: #d0dae0; --text: #1a2332; --text-dim: #667;
      --other-msg: #e2e9f1;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
    body { background:var(--bg); color:var(--text); direction:rtl; transition:background .2s, color .2s; }
    .hidden { display:none !important; }

    #loginScreen { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
    #userNameInput { padding:14px 20px; font-size:18px; border-radius:12px; border:none; width:280px; background:var(--bg-elev); color:var(--text); }
    button { padding:12px 24px; font-size:16px; border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { background:var(--primary-hover); }

    .icon-btn {
      padding:8px 12px; font-size:16px; border-radius:10px;
      background:var(--bg-elev); color:var(--text); border:1px solid var(--border);
      cursor:pointer; font-weight:normal;
    }
    .icon-btn:hover { background:var(--border); }

    #mainScreen { padding:16px; }
    .header { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .header-right { display:flex; gap:8px; align-items:center; }

    .user-item { display:flex; align-items:center; gap:10px; padding:12px; background:var(--bg-card); border-radius:10px; margin-bottom:8px; cursor:pointer; }
    .status-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
    .online { background:var(--online); }
    .offline { background:var(--offline); }

    .chat-header { display:flex; align-items:center; gap:12px; padding:12px; background:var(--bg-elev); border-radius:10px 10px 0 0; }
    .call-buttons { margin-left:auto; display:flex; gap:8px; }
    .call-btn { padding:8px 12px; font-size:14px; }
    .video { background:#3b82f6; color:#fff; }
    .audio { background:#10b981; color:#fff; }

    .messages-container { height:400px; overflow-y:auto; background:var(--bg); padding:12px; border:1px solid var(--border); border-top:none; }
    .message {
      margin-bottom:10px; padding:10px 14px; border-radius:16px; max-width:75%;
      word-wrap:break-word; display:flex; align-items:center; gap:8px;
    }
    .my-msg { background:var(--my-msg); color:#fff; margin-left:0; margin-right:auto; }
    .other-msg { background:var(--other-msg); color:var(--text); margin-right:0; margin-left:auto; }
    .del-btn {
      background:transparent; color:#fff; border:none; font-size:18px; cursor:pointer;
      padding:0 4px; opacity:.6; line-height:1; transition:opacity .2s;
    }
    .del-btn:hover { opacity:1; color:#ffcccc; }

    .input-area {
      display:flex; gap:8px; padding:12px; background:var(--bg-elev);
      border-radius:0 0 10px 10px; align-items:center; position:relative;
    }
    #messageInput {
      flex:1; padding:10px 14px; border-radius:8px; border:none;
      background:var(--bg); color:var(--text); font-size:15px;
    }

    #emojiPicker {
      position:absolute; bottom:70px; right:12px;
      background:var(--bg-elev); border:1px solid var(--border);
      border-radius:10px; padding:8px; max-width:280px;
      display:flex; flex-wrap:wrap; gap:4px;
      box-shadow:0 4px 20px rgba(0,0,0,.4); z-index:10;
    }
    #emojiPicker span {
      font-size:22px; cursor:pointer; padding:4px; border-radius:6px;
      transition:background .15s;
    }
    #emojiPicker span:hover { background:var(--border); }

    #videoCallOverlay { position:fixed; inset:0; background:#000; z-index:999; display:flex; flex-direction:column; }
    .video-container { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
    video { width:100%; height:100%; object-fit:cover; border-radius:10px; background:#1a1a1a; }
    .call-controls { display:flex; justify-content:center; gap:12px; padding:20px; flex-wrap:wrap; }
    .call-ctrl { background:#374151; color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:15px; cursor:pointer; }
    .call-ctrl.active { background:#f59e0b; color:#000; }
    .end-call { background:#ef4444; color:#fff; }
  </style>
</head>
<body>

<div id="loginScreen">
  <h1>تواصل 🤝</h1>
  <input type="text" id="userNameInput" placeholder="اكتب اسمك...">
  <button class="btn-primary" onclick="login()">ابدأ ✅</button>
</div>

<div id="mainScreen" class="hidden">
  <div class="header">
    <h2>قائمة الأصدقاء</h2>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="تبديل الوضع">🌙</button>
      <span id="myName"></span>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>
  <div id="usersList"></div>

  <div id="chatSection" class="hidden" style="margin-top:20px;">
    <div class="chat-header">
      <span id="chatWithName"></span>
      <div class="call-buttons">
        <button class="call-btn audio" onclick="startAudioCall()">📞 صوت</button>
        <button class="call-btn video" onclick="startVideoCall()">📹 فيديو</button>
      </div>
    </div>
    <div class="messages-container" id="messagesBox"></div>
    <div class="input-area">
      <button class="icon-btn" onclick="toggleEmoji(event)" title="إيموجي">😀</button>
      <input type="text" id="messageInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn-primary" onclick="sendMessage()">إرسال</button>
      <div id="emojiPicker" class="hidden"></div>
    </div>
  </div>
</div>

<div id="videoCallOverlay" class="hidden">
  <div class="video-container">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div class="call-controls">
    <button class="call-ctrl" id="muteBtn" onclick="toggleMute()">🔊 الصوت</button>
    <button class="call-ctrl" id="switchCamBtn" onclick="switchCamera()">🔄 تبديل الكاميرا</button>
    <button class="end-call" onclick="endCall()">إنهاء المكالمة ✖</button>
  </div>
</div>

<script>
// ✅ الإعدادات الصحيحة لمشروعك
const SUPABASE_URL = "https://unmulvjcgzppxluxvlrg.supabase.co";
const SUPABASE_KEY = "ضع-المفتاح-الكامل-هنا-مكان-هذا-الكلام";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" },
    { urls: "stun:stun3.l.google.com:19302" },
    { urls: "stun:stun4.l.google.com:19302" }
  ]
};

let currentUser = null, activeChatWith = null;
let peerConnection = null, peerTarget = null;
let localStream = null, remoteStream = null;
let isAudioOnly = false, isMuted = false, facingMode = "user";
let processingSignal = false, audioCtx = null;

function playNotif() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq; osc.type = "sine";
      const start = now + i * 0.12;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.15, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.1);
      osc.start(start); osc.stop(start + 0.12);
    });
  } catch (e) {}
}

function applyTheme() {
  const theme = localStorage.getItem("tawasol_theme") || "dark";
  document.body.classList.toggle("light", theme === "light");
  document.getElementById("themeBtn").textContent = theme === "light" ? "☀️" : "🌙";
}
function toggleTheme() {
  const isLight = document.body.classList.toggle("light");
  localStorage.setItem("tawasol_theme", isLight ? "light" : "dark");
  document.getElementById("themeBtn").textContent = isLight ? "☀️" : "🌙";
}

const EMOJIS = ["😀","😂","😍","🥰","😎","🤔","😢","😭","😡","👍","👎","🙏","👋","❤️","💔","🔥","✨","🎉","🌹","☕","🍕","⚽","🌟","💯","✅","❌","⚡","💡","🎵","🚀","🌙","☀️","🍀","🎁"];
function buildEmojiPicker() {
  const p = document.getElementById("emojiPicker");
  p.innerHTML = "";
  EMOJIS.forEach(e => {
    const s = document.createElement("span");
    s.textContent = e; s.onclick = () => addEmoji(e); p.appendChild(s);
  });
}
function toggleEmoji(ev) {
  if (ev) ev.stopPropagation();
  document.getElementById("emojiPicker").classList.toggle("hidden");
}
function addEmoji(e) {
  const inp = document.getElementById("messageInput");
  inp.value += e; inp.focus();
}
document.addEventListener("click", (e) => {
  const picker = document.getElementById("emojiPicker");
  if (!picker || picker.classList.contains("hidden")) return;
  if (!picker.contains(e.target) && !e.target.closest("button[onclick*='toggleEmoji']")) {
    picker.classList.add("hidden");
  }
});

function saveUserName(n) { localStorage.setItem("tawasol_name", n); }
function getSavedUserName() { return localStorage.getItem("tawasol_name") || ""; }

async function login() {
  const name = document.getElementById("userNameInput").value.trim();
  if (!name) return alert("اكتب اسمك من فضلك");
  saveUserName(name);
  currentUser = name;
  document.getElementById("myName").textContent = name;

  const { error } = await db.from("users").upsert({
    name: currentUser, online: true, last_seen: new Date().toISOString()
  });
  if (error) { alert("مشكلة في الاتصال: " + error.message); return; }

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");

  await loadUsers();
  listenUsers();
  listenMessages();
  listenCalls();
  buildEmojiPicker();

  setInterval(loadUsers, 3000);
  setInterval(() => {
    db.from("users").upsert({ name: currentUser, online: true, last_seen: new Date().toISOString() });
  }, 30000);
}

async function logout() {
  if (!confirm("تسجيل خروج؟")) return;
  if (currentUser) {
    await db.from("users").upsert({
      name: currentUser, online: false, last_seen: new Date().toISOString()
    });
  }
  endCall();
  localStorage.removeItem("tawasol_name");
  location.reload();
}

async function loadUsers() {
  const { data } = await db.from("users").select("*");
  if (!data) return;
  const list = document.getElementById("usersList"); list.innerHTML = "";
  data.forEach(u => {
    if (u.name === currentUser) return;
    const online = u.online && (Date.now() - new Date(u.last_seen).getTime()) < 40000;
    const item = document.createElement("div"); item.className = "user-item";
    item.onclick = () => openChat(u.name);
    const dot = document.createElement("span"); dot.className = "status-dot " + (online ? "online" : "offline");
    const nameSpan = document.createElement("span"); nameSpan.textContent = u.name;
    item.append(dot, nameSpan); list.appendChild(item);
  });
}

function openChat(name) {
  activeChatWith = name;
  document.getElementById("chatSection").classList.remove("hidden");
  document.getElementById("chatWithName").textContent = name;
  loadMessages();
}

async function sendMessage() {
  const text = document.getElementById("messageInput").value.trim();
  if (!text || !activeChatWith) return;
  await db.from("messages").insert({
    from: currentUser, to: activeChatWith, text, time: new Date().toISOString()
  });
  document.getElementById("messageInput").value = "";
  document.getElementById("emojiPicker").classList.add("hidden");
}

async function deleteMessage(id) {
  if (!confirm("حذف الرسالة عند الجميع؟")) return;
  await db.from("messages").delete().eq("id", id);
}

async function loadMessages() {
  if (!activeChatWith) return;
  const { data } = await db.from("messages")
    .or(`and(from.eq.${currentUser},to.eq.${activeChatWith}),and(from.eq.${activeChatWith},to.eq.${currentUser})`)
    .order("time", { ascending: true });
  const box = document.getElementById("messagesBox"); box.innerHTML = "";
  if (!data) return;
  data.forEach(m => {
    const mine = m.from === currentUser;
    const div = document.createElement("div");
    div.className = "message " + (mine ? "my-msg" : "other-msg");
    const textSpan = document.createElement("span");
    textSpan.textContent = m.text;
    div.appendChild(textSpan);
    if (mine && m.id) {
      const del = document.createElement("button");
      del.className = "del-btn"; del.textContent = "×"; del.title = "حذف عند الجميع";
      del.onclick = (e) => { e.stopPropagation(); deleteMessage(m.id); };
      div.appendChild(del);
    }
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function createPeer() {
  peerConnection = new RTCPeerConnection(rtcConfig);
  if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

  peerConnection.ontrack = e => {
    if (!remoteStream) remoteStream = new MediaStream();
    if (!remoteStream.getTracks().some(t => t.id === e.track.id)) {
      remoteStream.addTrack(e.track);
    }
    document.getElementById("remoteVideo").srcObject = remoteStream;
  };

  peerConnection.onicecandidate = async e => {
    if (e.candidate && peerTarget) {
      await db.from("call_signals").insert({
        from: currentUser, to: peerTarget, type: "ice", data: e.candidate.toJSON()
      });
    }
  };

  peerConnection.onconnectionstatechange = () => {
    const st = peerConnection?.connectionState;
    if (st === "connected") alert("✅ اتصلنا بنجاح!");
    if (st === "failed" || st === "disconnected" || st === "closed") endCall();
  };
}

function setupCallUI() {
  isMuted = false; facingMode = "user";
  document.getElementById("muteBtn").textContent = "🔊 الصوت";
  document.getElementById("muteBtn").classList.remove("active");
  document.getElementById("switchCamBtn").classList.toggle("hidden", isAudioOnly);
}

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const btn = document.getElementById("muteBtn");
  btn.textContent = isMuted ? "🔇 مكتوم" : "🔊 الصوت";
  btn.classList.toggle("active", isMuted);
}

async function switchCamera() {
  if (!localStream || isAudioOnly) return;
  facingMode = facingMode === "user" ? "environment" : "user";
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } }, audio: false
    });
    const newTrack = newStream.getVideoTracks()[0];
    const sender = peerConnection?.getSenders().find(s => s.track?.kind === "video");
    if (sender) await sender.replaceTrack(newTrack);
    localStream.getVideoTracks().forEach(t => t.stop());
    localStream.removeTrack(localStream.getVideoTracks()[0]);
    localStream.addTrack(newTrack);
    document.getElementById("localVideo").srcObject = localStream;
  } catch { alert("ما قدرت أبدل الكاميرا"); }
}

async function startAudioCall() {
  if (!activeChatWith) return alert("افتح محادثة أولاً");
  isAudioOnly = true;
  await startCall(activeChatWith);
}

async function startVideoCall() {
  if (!activeChatWith) return alert("افتح محادثة أولاً");
  isAudioOnly = false;
  await startCall(activeChatWith);
}

async function startCall(target) {
  try {
    endCall();
    peerTarget = target;
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true, video: isAudioOnly ? false : true
    });
    document.getElementById("localVideo").srcObject = localStream;
    document.getElementById("videoCallOverlay").classList.remove("hidden");
    setupCallUI();
    createPeer();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await db.from("call_signals").insert({
      from: currentUser, to: target, type: "offer",
      data: peerConnection.localDescription, audio_only: isAudioOnly
    });
  } catch {
    alert("ما قدرت أفتح الكاميرا/الميكروفون"); endCall();
  }
}

function listenCalls() {
  db.channel("call_signals_" + currentUser).on('postgres_changes', {
    event: 'INSERT', schema: 'public', table: 'call_signals',
    filter: `to=eq.${currentUser}`
  }, async (payload) => {
    if (processingSignal) return;
    processingSignal = true;
    const sig = payload.new;
    try {
      if (sig.type === "offer") {
        playNotif();
        if (!confirm(`${sig.from} يتصل بك — هل تريد الإجابة؟`)) return processingSignal = false;
        isAudioOnly = sig.audio_only || false;
        peerTarget = sig.from;
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true, video: isAudioOnly ? false : true
        });
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("videoCallOverlay").classList.remove("hidden");
        setupCallUI();
        createPeer();
        await peerConnection.setRemoteDescription(sig.data);
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        await db.from("call_signals").insert({
          from: currentUser, to: sig.from, type: "answer",
          data: peerConnection.localDescription
        });
      } else if (sig.type === "answer" && peerConnection) {
        await peerConnection.setRemoteDescription(sig.data);
      } else if (sig.type === "ice" && peerConnection && peerConnection.remoteDescription) {
        await peerConnection.addIceCandidate(sig.data).catch(()=>{});
      }
    } catch (err) { console.error("خطأ:", err); }
    processingSignal = false;
  }).subscribe();
}

function endCall() {
  try { peerConnection?.close(); } catch {}
  localStream?.getTracks().forEach(t => t.stop());
  peerConnection = localStream = remoteStream = peerTarget = null;
  processingSignal = false;
  document.getElementById("videoCallOverlay").classList.add("hidden");
  document.getElementById("localVideo").srcObject = null;
  document.getElementById("remoteVideo").srcObject = null;
}

function listenUsers() {
  db.channel("users_changes").on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, loadUsers).subscribe();
}

function listenMessages() {
  db.channel("messages_changes").on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (payload) => {
    if (!activeChatWith) return;
    const m = payload.new;
    if ((m.from === currentUser && m.to === activeChatWith) ||
        (m.from === activeChatWith && m.to === currentUser)) {
      loadMessages();
      if (m.from !== currentUser) playNotif();
    }
  }).subscribe();
}

window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  const saved = getSavedUserName();
  if (saved) document.getElementById("userNameInput").value = saved;
});

window.addEventListener('beforeunload', () => {
  if (!currentUser) return;
  db.from("users").upsert({ name: currentUser, online: false, last_seen: new Date().toISOString() });
});
</script>
</body>
</html>
