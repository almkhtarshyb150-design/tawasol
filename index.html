<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00897b">
  <title>Tawasol — تواصل 🤝</title>
  <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    :root{--bg:#0f1b2b;--card:#1a2c42;--text:#e6edf3;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--ai:#a855f7}
    body{background:var(--bg);color:var(--text);min-height:100vh}
    .screen{display:none;padding:1rem;max-width:500px;margin:0 auto}
    .screen.active{display:block}
    .start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .app-title{font-size:2.2rem;font-weight:bold;margin-bottom:.5rem}
    .app-desc{opacity:.7;margin-bottom:2rem}
    .input{width:100%;padding:.9rem 1rem;border:none;border-radius:.75rem;background:var(--card);color:var(--text);font-size:1rem;margin-bottom:1rem}
    .btn{width:100%;padding:.9rem;border:none;border-radius:.75rem;font-size:1rem;font-weight:bold;cursor:pointer;margin:.5rem 0;transition:.2s}
    .btn-primary{background:var(--blue);color:white}
    .btn-primary:hover{opacity:.9}
    .nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:.75rem 0;z-index:100}
    .nav-btn{background:transparent;border:none;color:var(--text);font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;opacity:.6}
    .nav-btn.active{opacity:1;color:var(--blue)}
    .page-title{font-size:1.4rem;font-weight:bold;margin:1rem 0}
    .message{background:var(--card);padding:.75rem 1rem;border-radius:1rem;margin:.5rem 0;max-width:85%}
    .message.me{margin-left:auto;background:var(--blue)}
    .input-area{position:fixed;bottom:4rem;left:0;right:0;padding:.75rem;background:var(--card);display:flex;gap:.5rem;max-width:500px;margin:0 auto}
    .input-area .input{margin:0;flex:1}
    .video-box{background:var(--card);border-radius:1rem;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;margin:1rem 0}
    video{width:100%;height:100%;border-radius:1rem;object-fit:cover}
    .status{text-align:center;padding:.5rem;border-radius:.5rem;margin:.5rem 0}
    .status.info{background:#3b82f622}
  </style>
</head>
<body>

<!-- شاشة البداية — باسم فقط بلا صورة -->
<div id="startScreen" class="screen active start-screen">
  <h1 class="app-title">تواصل 🤝</h1>
  <p class="app-desc">رسائل • مكالمات • ذكاء اصطناعي</p>
  <input type="text" id="nameInput" class="input" placeholder="اكتب اسمك هنا...">
  <button id="startBtn" class="btn btn-primary">✅ ابدأ الاستخدام</button>
</div>

<!-- الصفحة الرئيسية -->
<div id="mainScreen" class="screen">
  <h2 class="page-title" id="pageTitle">الرسائل العامة</h2>
  <div id="contentArea" style="padding-bottom:5rem"></div>
</div>

<!-- شريط التنقل في الأسفل -->
<nav class="nav-bar" id="navBar" style="display:none">
  <button class="nav-btn active" data-page="public">💬 عام</button>
  <button class="nav-btn" data-page="private">👤 خاص</button>
  <button class="nav-btn" data-page="video">📹 فيديو</button>
  <button class="nav-btn" data-page="ai">🤖 ذكاء</button>
</nav>

<!-- مربع الكتابة -->
<div class="input-area" id="inputArea" style="display:none">
  <input type="text" id="msgInput" class="input" placeholder="اكتب رسالتك...">
  <button id="sendBtn" class="btn btn-primary" style="width:auto;padding:.9rem 1.2rem">إرسال</button>
</div>

<script>
// ----- إعداد فايربيز -----
const firebaseConfig = {
  apiKey: "AIzaSyCz9x9Z8hK8eYbX7M9pR8aQw2eT3yU4i5oP7",
  authDomain: "tawasol-app.firebaseapp.com",
  projectId: "tawasol-app",
  storageBucket: "tawasol-app.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl01"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ----- بيانات المستخدم -----
let userName = '';
let currentPage = 'public';

// ----- الدخول -----
document.getElementById('startBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return alert('اكتب اسمك أولاً!');
  userName = name;
  
  // إظهار التطبيق بلا أي طلب صورة أو صلاحيات
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  document.getElementById('navBar').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'flex';
  
  loadPublicMessages();
});

// ----- التنقل بين الصفحات -----
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    
    document.getElementById('pageTitle').textContent = {
      public: 'الرسائل العامة',
      private: 'الرسائل الخاصة',
      video: 'مكالمات الفيديو',
      ai: 'الذكاء الاصطناعي'
    }[currentPage];
    
    document.getElementById('contentArea').innerHTML = '';
    
    if (currentPage === 'public') loadPublicMessages();
    if (currentPage === 'private') loadPrivateMessages();
    if (currentPage === 'video') loadVideoPage();
    if (currentPage === 'ai') loadAIPage();
  });
});

// ----- الرسائل العامة -----
function loadPublicMessages() {
  db.collection('public_chat').orderBy('time').onSnapshot(snap => {
    const area = document.getElementById('contentArea');
    area.innerHTML = '';
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement('div');
      div.className = 'message' + (m.from === userName ? ' me' : '');
      div.innerHTML = `<strong>${m.from}:</strong> ${m.text}`;
      area.appendChild(div);
    });
    window.scrollTo(0, document.body.scrollHeight);
  });
}

// ----- الرسائل الخاصة -----
function loadPrivateMessages() {
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <p class="status info">اكتب اسم الشخص الذي تريد مراسلته ثم الرسالة مفصولة بـ : </p>
    <p class="status info">مثال: أحمد: كيف حالك؟</p>
  `;
}

// ----- صفحة الفيديو — يطلب الكاميرا فقط وقت الاستخدام -----
function loadVideoPage() {
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="video-box" id="localVideoBox">
      <span>كاميرتك — اضغط لتفعيلها</span>
    </div>
    <button class="btn btn-primary" id="startCamBtn">📷 تشغيل الكاميرا</button>
    <p class="status info" style="margin-top:1rem">ملاحظة: سيطلب منك الإذن بالكاميرا فقط عند الضغط على الزر أعلاه ✅</p>
  `;
  
  document.getElementById('startCamBtn').addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      const box = document.getElementById('localVideoBox');
      box.innerHTML = '';
      const video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay = true;
      video.muted = true;
      box.appendChild(video);
      document.getElementById('startCamBtn').textContent = '✅ الكاميرا شغالة';
    } catch (err) {
      alert('لم يتم السماح بالكاميرا — عادي استخدم باقي التطبيق ✅');
    }
  });
}

// ----- الذكاء الاصطناعي -----
function loadAIPage() {
  const area = document.getElementById('contentArea');
  area.innerHTML = `<p class="status info">اسألني أي سؤال وسأجيبك فوراً 🤖</p>`;
}

// ----- إرسال الرسائل -----
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', e => e.key === 'Enter' && sendMessage());

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  
  if (currentPage === 'public') {
    db.collection('public_chat').add({
      from: userName,
      text: text,
      time: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  
  input.value = '';
}
</script>
</body>
</html>
