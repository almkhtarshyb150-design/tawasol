<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1b2b">
  <title>تواصل 🤝</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    body{background:#0f1b2b;color:#fff;direction:rtl}
    .app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
    .screen{display:none;flex:1;padding:1rem}
    .screen.active{display:flex;flex-direction:column}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem;background:#172538;border-bottom:1px solid #2a3f5c}
    .chat-header{display:flex;align-items:center;gap:.5rem}
    .status-dot{width:10px;height:10px;border-radius:50%;background:#666}
    .status-dot.online{background:#22c55e}
    .messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
    .msg{max-width:75%;padding:.75rem 1rem;border-radius:18px;line-height:1.4}
    .msg.me{align-self:flex-end;background:#0084ff;border-bottom-right-radius:4px}
    .msg.other{align-self:flex-start;background:#2a3f5c;border-bottom-left-radius:4px}
    .input-area{display:flex;gap:.5rem;padding:1rem;background:#172538;border-top:1px solid #2a3f5c}
    input,button{border:none;border-radius:24px;padding:.75rem 1rem;font-size:1rem}
    input{flex:1;background:#2a3f5c;color:#fff}
    button{background:#0084ff;color:#fff;cursor:pointer}
    .user-list{display:flex;flex-direction:column;gap:.5rem}
    .user-item{display:flex;align-items:center;gap:.75rem;padding:1rem;background:#172538;border-radius:12px;cursor:pointer}
    .user-item:hover{background:#2a3f5c}
    .login-screen{justify-content:center;align-items:center;gap:1.5rem;text-align:center}
    .login-screen h1{font-size:2rem}
    .login-screen input{width:100%;max-width:320px;text-align:center}
    .action-buttons{display:flex;gap:.5rem;margin-right:auto}
    .icon-btn{width:36px;height:36px;border-radius:50%;background:#2a3f5c;display:flex;align-items:center;justify-content:center;padding:0}
  </style>
</head>
<body>
<div class="app">

  <div id="loginScreen" class="screen login-screen active">
    <h1>🤝 تواصل</h1>
    <input type="text" id="nameInput" placeholder="اكتب اسمك...">
    <button onclick="startApp()">ابدأ ✅</button>
  </div>

  <div id="listScreen" class="screen">
    <div class="top-bar"><h2>المراسلة</h2></div>
    <div id="userList" class="user-list"></div>
  </div>

  <div id="chatScreen" class="screen">
    <div class="top-bar">
      <button onclick="backToList()" style="background:none;color:#fff;padding:.5rem">← رجوع</button>
      <div class="chat-header">
        <span id="chatName"></span>
        <span id="chatStatus" class="status-dot"></span>
      </div>
      <div class="action-buttons">
        <button class="icon-btn" title="مكالمة صوت">📞</button>
        <button class="icon-btn" title="مكالمة فيديو">📹</button>
      </div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">إرسال</button>
    </div>
  </div>

</div>

<script>
// ✅ تم وضع المفتاح والرابط بشكل صحيح
const SUPABASE_URL = "https://unmulvjcgzppxluxrluxrg.supabase.co";
const SUPABASE_KEY = "sb_publishable_kZAo8wC6pFDCInPUdq-qSw_jUvYll4b";

const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let myName = localStorage.getItem("myName") || "";
let chatWith = null;

async function startApp(){
  const name = document.getElementById("nameInput").value.trim();
  if(!name) return alert("اكتب اسمك أولاً ✋");
  
  myName = name;
  localStorage.setItem("myName", myName);

  await supabase.from("users").upsert({
    name: myName,
    online: true,
    last_seen: new Date().toISOString()
  });

  showScreen("listScreen");
  loadUsers();
  setInterval(loadUsers, 5000);
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

async function loadUsers(){
  const {data} = await supabase.from("users").select("*");
  const list = document.getElementById("userList");
  list.innerHTML = "";
  
  data.forEach(u=>{
    if(u.name === myName) return;
    const isOnline = u.online && (Date.now() - new Date(u.last_seen).getTime()) < 60000;
    list.innerHTML += `
      <div class="user-item" onclick="openChat('${u.name}')">
        <span class="status-dot ${isOnline?'online':''}"></span>
        <span>${u.name}</span>
      </div>
    `;
  });
}

async function openChat(name){
  chatWith = name;
  document.getElementById("chatName").textContent = name;
  showScreen("chatScreen");
  loadMessages();
}

function backToList(){
  chatWith = null;
  showScreen("listScreen");
  loadUsers();
}

async function loadMessages(){
  if(!chatWith) return;
  const {data} = await supabase
    .from("messages")
    .select("*")
    .or(`and(sender.eq.${myName},receiver.eq.${chatWith}),and(sender.eq.${chatWith},receiver.eq.${myName})`)
    .order("created_at",{ascending:true});

  const box = document.getElementById("messages");
  box.innerHTML = "";
  data.forEach(m=>{
    box.innerHTML += `<div class="msg ${m.sender===myName?'me':'other'}">${m.text}</div>`;
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text || !chatWith) return;

  input.value = "";
  await supabase.from("messages").insert({
    sender: myName,
    receiver: chatWith,
    text: text
  });
  loadMessages();
}

setInterval(()=>{
  if(chatWith) loadMessages();
}, 2000);

setInterval(()=>{
  if(myName){
    supabase.from("users").upsert({
      name: myName,
      online: true,
      last_seen: new Date().toISOString()
    });
  }
}, 30000);

if(myName){
  document.getElementById("nameInput").value = myName;
  startApp();
}
</script>
</body>
</html>
