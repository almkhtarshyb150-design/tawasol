<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1b2b">
<title>تواصل 🤝</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
  body{background:#0f1b2b;color:#e6edf3;min-height:100vh}

  /* شاشة الدخول */
  .auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  .auth-card{background:#1a2c42;padding:30px;border-radius:20px;max-width:400px;width:100%;text-align:center}
  h2{color:#00c49a;margin-bottom:20px;font-size:26px}
  input{width:100%;padding:15px;border-radius:12px;border:none;background:#152538;color:white;font-size:16px;margin-bottom:15px;text-align:center}
  button{width:100%;padding:15px;border-radius:25px;border:none;background:#00c49a;color:white;font-weight:bold;font-size:17px;cursor:pointer}
  button:active{transform:scale(0.97)}
  .hidden{display:none !important}

  /* التطبيق */
  .top-bar{position:fixed;top:0;left:0;right:0;background:#1a2c42;padding:12px;display:flex;justify-content:space-between;align-items:center}
  .app-name{color:#00c49a;font-weight:bold;font-size:18px}
  .btn-small{width:auto;padding:8px 15px;background:#d32f2f;font-size:14px;border-radius:20px}
  .keys-btn{background:#00c49a;margin-right:8px}

  .nav-bar{position:fixed;top:55px;left:0;right:0;background:#1a2c42;padding:10px;display:flex;justify-content:space-around;border-bottom:1px solid #22344d}
  .nav-btn{background:transparent;border:none;color:#9fb0b5;padding:10px 20px;border-radius:10px;font-size:15px}
  .nav-btn.active{background:rgba(0,196,154,0.15);color:#00c49a}

  .content{margin-top:100px;padding:15px;padding-bottom:90px;max-width:600px;margin-left:auto;margin-right:auto}
  .page{display:none}
  .page.active{display:block}
  .page-title{color:#00c49a;text-align:center;margin-bottom:20px;font-size:20px}

  .keys-status{background:rgba(0,196,154,0.1);padding:12px;border-radius:10px;margin-bottom:20px;font-size:14px}
  .key-row{display:flex;justify-content:space-between;padding:5px 0}
  .dot{width:10px;height:10;border-radius:50%;display:inline-block;margin-left:5px}
  .dot-green{background:#00c49a}
  .dot-red{background:#d32f2f}
  .dot-gray{background:#555}

  .chat-box{min-height:350px}
  .msg{margin:10px 0;max-width:90%}
  .msg.me{margin-left:auto}
  .bubble{background:#24344d;padding:12px 16px;border-radius:18px;border-bottom-right-radius:6px}
  .msg.me .bubble{background:#00c49a;color:white}

  .input-bar{position:fixed;bottom:0;left:0;right:0;background:#1a2c42;padding:10px;display:flex;gap:8px;border-top:1px solid #22344d}
  .msg-input{flex:1;padding:13px 18px;border-radius:25px;border:none;background:#152538;color:white;font-size:16px;text-align:right}
  .send-btn{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px}

  /* نافذة المفاتيح */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:#1a2c42;padding:25px;border-radius:20px;max-width:400px;width:100%}
  .modal-box h3{color:#00c49a;text-align:center;margin-bottom:20px}
  .modal-box input{text-align:left;margin-bottom:10px}
  .modal-buttons{display:flex;gap:10px;margin-top:5px}
  .modal-btn{flex:1;padding:12px;font-size:15px}
  .cancel{background:#374151}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h2>🤝 تواصل</h2>
    <input type="text" id="nameInput" placeholder="اكتب اسمك هنا...">
    <button id="startButton" onclick="startNow()">✅ ابدأ الاستخدام</button>
    <p id="errorText" style="color:#ff6b6b;margin-top:15px;display:none"></p>
  </div>
</div>

<!-- التطبيق كله -->
<div id="appArea" class="hidden">
  <div class="top-bar">
    <span class="app-name">🤝 تواصل</span>
    <div style="display:flex">
      <button class="btn-small keys-btn" onclick="openKeys()">🔑 المفاتيح</button>
      <button class="btn-small" onclick="logout()">خروج</button>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="showPage('general')">📢 عام</button>
    <button class="nav-btn" onclick="showPage('ai')">🤖 الذكاء</button>
  </div>

  <div class="content">
    <!-- صفحة الرسائل العامة -->
    <div class="page active" id="page-general">
      <h2 class="page-title">📢 الرسائل العامة</h2>
      <div class="chat-box" id="generalBox"></div>
    </div>

    <!-- صفحة الذكاء -->
    <div class="page" id="page-ai">
      <h2 class="page-title">🤖 الذكاء الاصطناعي</h2>
      <div class="keys-status" id="keysStatus">
        <div class="key-row"><span>المفتاح 1</span><span id="k1-status"><span class="dot dot-gray"></span> لم يوضع</span></div>
        <div class="key-row"><span>المفتاح 2</span><span id="k2-status"><span class="dot dot-gray"></span> لم يوضع</span></div>
        <div class="key-row"><span>المفتاح 3</span><span id="k3-status"><span class="dot dot-gray"></span> لم يوضع</span></div>
        <div class="key-row" style="margin-top:8px;padding-top:8px;border-top:1px solid #2a3b4c">
          <span>المستخدم</span><span id="active-which">—</span>
        </div>
      </div>
      <div class="chat-box" id="aiBox"></div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" class="msg-input" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">✓</button>
  </div>
</div>

<!-- نافذة المفاتيح -->
<div class="modal" id="keysModal">
  <div class="modal-box">
    <h3>🔑 المفاتيح الثلاثة</h3>
    <input type="password" id="key1" placeholder="المفتاح الأول">
    <input type="password" id="key2" placeholder="المفتاح الثاني (اختياري)">
    <input type="password" id="key3" placeholder="المفتاح الثالث (اختياري)">
    <p style="font-size:13px;opacity:0.7;margin:10px 0">لو المفتاح الأول توقف → يشتغل بالتاني تلقائياً ✅</p>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeKeys()">إلغاء</button>
      <button class="modal-btn" onclick="saveKeys()">حفظ ✅</button>
    </div>
  </div>
</div>

<script>
let myName = "";
let keys = [];
let activeIndex = 0;

// ✅ زر البدء — شغال 100%
function startNow(){
  const input = document.getElementById("nameInput");
  const name = input.value.trim();
  const err = document.getElementById("errorText");

  if(!name){
    err.textContent = "❌ اكتب اسمك أولاً!";
    err.style.display = "block";
    input.style.border = "2px solid #ff6b6b";
    return;
  }
  if(name.length < 2){
    err.textContent = "❌ الاسم قصير جداً!";
    err.style.display = "block";
    return;
  }

  // ✅ تم الدخول
  myName = name;
  localStorage.setItem("tawasol_name", name);
  
  // إخفاء شاشة الدخول
  document.getElementById("authScreen").classList.add("hidden");
  // إظهار التطبيق
  document.getElementById("appArea").classList.remove("hidden");
  
  loadSavedKeys();
  addMsg("generalBox", "نظام", `أهلاً وسهلاً يا ${myName}! 🤝 التطبيق جاهز ✅`, false);
}

function showPage(name){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(`page-${name}`).classList.add("active");
}

function addMsg(boxId, from, text, isMe){
  const box = document.getElementById(boxId);
  const div = document.createElement("div");
  div.className = `msg ${isMe?"me":""}`;
  div.innerHTML = `<div class="bubble"><strong>${from}:</strong><br>${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;

  const isAI = document.getElementById("page-ai").classList.contains("active");
  
  if(!isAI){
    addMsg("generalBox", myName, text, true);
  }else{
    if(keys.length === 0){
      alert("⚠️ ضع مفاتيحك أولاً من زر «المفاتيح» فوق");
      return;
    }
    addMsg("aiBox", myName, text, true);
    askAI(text);
  }
  input.value = "";
}

async function askAI(q){
  addMsg("aiBox", "🤖", "⏳ جاري التفكير...", false);

  for(let tryIndex = 0; tryIndex < keys.length; tryIndex++){
    const key = keys[activeIndex];
    
    try{
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${key}`
        },
        body: JSON.stringify({
          model: "llama3-8b-8192",
          messages: [{role: "user", content: q}]
        })
      });

      const data = await res.json();
      document.querySelector("#aiBox .msg:last-child")?.remove();
      
      if(data.error) throw new Error(data.error.message);
      
      addMsg("aiBox", "🤖 الذكاء", data.choices[0].message.content, false);
      return;
      
    }catch(err){
      console.log("مفتاح فشل:", err.message);
      activeIndex = (activeIndex + 1) % keys.length;
      updateKeysDisplay();
      
      if(tryIndex === keys.length - 1){
        document.querySelector("#aiBox .msg:last-child")?.remove();
        addMsg("aiBox", "⚠️ خطأ", "كل المفاتيح لا تعمل! أضف مفاتيح جديدة.", false);
      }
    }
  }
}

function openKeys(){
  document.getElementById("keysModal").classList.add("show");
}
function closeKeys(){
  document.getElementById("keysModal").classList.remove("show");
}

function saveKeys(){
  const k1 = document.getElementById("key1").value.trim();
  const k2 = document.getElementById("key2").value.trim();
  const k3 = document.getElementById("key3").value.trim();

  function valid(k){ return k && k.length > 20; }

  keys = [];
  if(valid(k1)){ localStorage.setItem("k1",k1); keys.push(k1); } else localStorage.removeItem("k1");
  if(valid(k2)){ localStorage.setItem("k2",k2); keys.push(k2); } else localStorage.removeItem("k2");
  if(valid(k3)){ localStorage.setItem("k3",k3); keys.push(k3); } else localStorage.removeItem("k3");

  activeIndex = 0;
  updateKeysDisplay();
  closeKeys();
  alert(keys.length > 0 ? `✅ تم حفظ ${keys.length} مفتاح` : "⚠️ لم يتم حفظ أي مفتاح");
}

function loadSavedKeys(){
  keys = [];
  [localStorage.getItem("k1"), localStorage.getItem("k2"), localStorage.getItem("k3")].forEach(k=>{
    if(k && k.length > 20) keys.push(k);
  });
  updateKeysDisplay();
}

function updateKeysDisplay(){
  for(let i=1; i<=3; i++){
    const k = localStorage.getItem(`k${i}`);
    const status = document.getElementById(`k${i}-status`);
    if(!k){
      status.innerHTML = `<span class="dot dot-gray"></span> لم يوضع`;
    }else if(keys.indexOf(k) === activeIndex){
      status.innerHTML = `<span class="dot dot-green"></span> نشط ✅`;
    }else{
      status.innerHTML = `<span class="dot dot-green"></span> جاهز`;
    }
  }
  document.getElementById("active-which").textContent = 
    keys.length > 0 ? `مفتاح ${activeIndex+1} من ${keys.length}` : "لا يوجد";
}

function logout(){
  if(confirm("تسجيل الخروج؟")){
    localStorage.removeItem("tawasol_name");
    location.reload();
  }
}

window.onload = function(){
  const saved = localStorage.getItem("tawasol_name");
  if(saved) document.getElementById("nameInput").value = saved;
};
</script>
</body>
</html>
