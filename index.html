<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل 🤝</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
    body { background:#0f1b2b; color:#fff; direction:rtl; }
    .hidden { display:none !important; }
    
    /* شاشة الدخول */
    #loginScreen { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
    #userNameInput { padding:14px 20px; font-size:18px; border-radius:12px; border:none; width:280px; background:#1e2f44; color:#fff; }
    button { padding:12px 24px; font-size:16px; border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
    .btn-primary { background:#2563eb; color:#fff; }
    .btn-primary:hover { background:#1d4ed8; }
    
    /* الشاشة الرئيسية */
    #mainScreen { padding:16px; }
    .header { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #2a3b4f; margin-bottom:16px; }
    .user-item { display:flex; align-items:center; gap:10px; padding:12px; background:#1a2c42; border-radius:10px; margin-bottom:8px; cursor:pointer; }
    .status-dot { width:12px; height:12px; border-radius:50%; }
    .online { background:#22c55e; }
    .offline { background:#ef4444; }
    
    /* المحادثة */
    .chat-header { display:flex; align-items:center; gap:12px; padding:12px; background:#1e2f44; border-radius:10px 10px 0 0; }
    .call-buttons { margin-left:auto; display:flex; gap:8px; }
    .call-btn { padding:8px 12px; font-size:14px; }
    .video { background:#3b82f6; color:#fff; }
    .audio { background:#10b981; color:#fff; }
    .messages-container { height:400px; overflow-y:auto; background:#0f1b2b; padding:12px; border:1px solid #2a3b4f; border-top:none; }
    .message { margin-bottom:10px; padding:10px 14px; border-radius:16px; max-width:75%; }
    .my-msg { background:#2563eb; margin-left:0; margin-right:auto; }
    .other-msg { background:#1e2f44; margin-right:0; margin-left:auto; }
    .input-area { display:flex; gap:8px; padding:12px; background:#1e2f44; border-radius:0 0 10px 10px; }
    #messageInput { flex:1; padding:10px 14px; border-radius:8px; border:none; background:#0f1b2b; color:#fff; }
    
    /* مكالمة الفيديو */
    #videoCallOverlay { position:fixed; inset:0; background:#000; z-index:999; display:flex; flex-direction:column; }
    .video-container { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
    video { width:100%; height:100%; object-fit:cover; border-radius:10px; background:#1a1a1a; }
    .call-controls { display:flex; justify-content:center; gap:20px; padding:20px; }
    .end-call { background:#ef4444; color:#fff; }
  </style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen">
  <h1>تواصل 🤝</h1>
  <input type="text" id="userNameInput" placeholder="اكتب اسمك...">
  <button class="btn-primary" onclick="login()">ابدأ ✅</button>
</div>

<!-- الشاشة الرئيسية -->
<div id="mainScreen" class="hidden">
  <div class="header">
    <h2>قائمة الأصدقاء</h2>
    <span id="myName"></span>
  </div>
  <div id="usersList"></div>

  <!-- المحادثة -->
  <div id="chatSection" class="hidden" style="margin-top:20px;">
    <div class="chat-header">
      <span id="chatWithName"></span>
      <div class="call-buttons">
        <button class="call-btn audio" onclick="startAudioCall()">📞 صوت</button>
        <button class="call-btn video" onclick="startVideoCall()">📹 فيديو</button>
      </div>
    </div>
    <div class="messages-container" id="messagesBox"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="اكتب رسالتك...">
      <button class="btn-primary" onclick="sendMessage()">إرسال</button>
    </div>
  </div>
</div>

<!-- شاشة المكالمة -->
<div id="videoCallOverlay" class="hidden">
  <div class="video-container">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div class="call-controls">
    <button class="end-call" onclick="endCall()">إنهاء المكالمة ✖</button>
  </div>
</div>

<script>
// === 🔗 إعدادات قاعدة البيانات ===
const SUPABASE_URL = "https://communication-171c9.supabase.co";
const SUPABASE_KEY = "AIzaSyDkAYTpoTBXCSBHZTHbGfC8Yn2pQogR-4M";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// === 📞 إعدادات الاتصال (تشتغل في ليبيا) ===
const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" }
  ]
};

// === 📝 بيانات المستخدم الحالي ===
let currentUser = null;
let activeChatWith = null;
let peerConnection = null;
let localStream = null;
let remoteStream = null;
let isAudioOnly = false;

// === 💾 حفظ اسم المستخدم ===
function saveUserName(name) {
  localStorage.setItem("tawasol_name", name);
}
function getSavedUserName() {
  return localStorage.getItem("tawasol_name") || "";
}

// === 🔑 الدخول ===
async function login() {
  const name = document.getElementById("userNameInput").value.trim();
  if (!name) return alert("اكتب اسمك من فضلك");

  saveUserName(name);
  currentUser = name;
  document.getElementById("myName").textContent = name;

  // تحديث حالة الاتصال
  await db.from("users").upsert({ name: currentUser, online: true, last_seen: new Date().toISOString() });

  // إخفاء شاشة الدخول
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");

  // بدء الاستماع
  loadUsers();
  listenUsers();
  listenMessages();
  listenCalls();

  // تحديث الحالة كل 30 ثانية
  setInterval(() => {
    db.from("users").upsert({ name: currentUser, online: true, last_seen: new Date().toISOString() });
  }, 30000);

  // تحديث القائمة كل ثانية
  setInterval(loadUsers, 1000);
}

// === 👥 تحميل قائمة المستخدمين ===
async function loadUsers() {
  const { data } = await db.from("users").select("*");
  if (!data) return;

  const list = document.getElementById("usersList");
  list.innerHTML = "";

  data.forEach(u => {
    if (u.name === currentUser) return;
    const isOnline = u.online && (Date.now() - new Date(u.last_seen).getTime()) < 40000;
    
    list.innerHTML += `
      <div class="user-item" onclick="openChat('${u.name}')">
        <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
        <span>${u.name}</span>
      </div>
    `;
  });
}

// === 💬 فتح محادثة ===
function openChat(name) {
  activeChatWith = name;
  document.getElementById("chatSection").classList.remove("hidden");
  document.getElementById("chatWithName").textContent = name;
  loadMessages();
}

// === 📤 إرسال رسالة ===
async function sendMessage() {
  const text = document.getElementById("messageInput").value.trim();
  if (!text || !activeChatWith) return;

  await db.from("messages").insert({
    from: currentUser,
    to: activeChatWith,
    text: text,
    time: new Date().toISOString()
  });

  document.getElementById("messageInput").value = "";
  loadMessages();
}

// === 📥 تحميل الرسائل ===
async function loadMessages() {
  if (!activeChatWith) return;

  const { data } = await db.from("messages")
    .or(`and(from.eq.${currentUser},to.eq.${activeChatWith}),and(from.eq.${activeChatWith},to.eq.${currentUser})`)
    .order("time", { ascending: true });

  const box = document.getElementById("messagesBox");
  box.innerHTML = "";

  if (data) {
    data.forEach(m => {
      const isMine = m.from === currentUser;
      box.innerHTML += `
        <div class="message ${isMine ? 'my-msg' : 'other-msg'}">
          ${m.text}
        </div>
      `;
    });
  }
  box.scrollTop = box.scrollHeight;
}

// === 📞 بدء مكالمة صوت فقط ===
async function startAudioCall() {
  if (!activeChatWith) return alert("افتح محادثة أولاً");
  isAudioOnly = true;
  await startCall(activeChatWith);
}

// === 📹 بدء مكالمة فيديو ===
async function startVideoCall() {
  if (!activeChatWith) return alert("افتح محادثة أولاً");
  isAudioOnly = false;
  await startCall(activeChatWith);
}

// === 🔄 بدء الاتصال العام ===
async function startCall(targetName) {
  try {
    // فتح الكاميرا أو الميكروفون فقط
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: !isAudioOnly  // ✅ صوت فقط = الكاميرا مفتحتش
    });

    // عرض الفيديو المحلي
    document.getElementById("localVideo").srcObject = localStream;
    document.getElementById("videoCallOverlay").classList.remove("hidden");

    // إنشاء اتصال
    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    // استقبال فيديو الطرف الثاني
    peerConnection.ontrack = e => {
      if (!remoteStream) remoteStream = new MediaStream();
      remoteStream.addTrack(e.track, remoteStream);
      document.getElementById("remoteVideo").srcObject = remoteStream;
    };

    // إرسال العرض
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    // حفظ الإشارة في قاعدة البيانات
    await db.from("call_signals").insert({
      from: currentUser,
      to: targetName,
      type: "offer",
      data: peerConnection.localDescription,
      audio_only: isAudioOnly
    });

  } catch (err) {
    console.error("خطأ في المكالمة:", err);
    alert("ما قدرت أفتح الكاميرا/الميكروفون — تأكد من الإذنات");
  }
}

// === 📥 استقبال إشارة الاتصال ===
async function listenCalls() {
  db.channel('call_signals_changes').on('postgres_changes', {
    event: 'INSERT', schema: 'public', table: 'call_signals',
    filter: `to=eq.${currentUser}`
  }, async (payload) => {
    const signal = payload.new;
    
    if (signal.type === "offer") {
      if (confirm(`${signal.from} يتصل بك — هل تريد الإجابة؟`)) {
        isAudioOnly = signal.audio_only || false;
        await acceptCall(signal);
      }
    }
    else if (signal.type === "answer" && peerConnection) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
    }
    else if (signal.type === "ice" && peerConnection) {
      await peerConnection.addIceCandidate(new RTCIceCandidate(signal.data));
    }
  }).subscribe();
}

// ✅ قبول الاتصال
async function acceptCall(signal) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: !isAudioOnly
    });

    document.getElementById("localVideo").srcObject = localStream;
    document.getElementById("videoCallOverlay").classList.remove("hidden");

    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = e => {
      if (!remoteStream) remoteStream = new MediaStream();
      remoteStream.addTrack(e.track);
      document.getElementById("remoteVideo").srcObject = remoteStream;
    };

    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    await db.from("call_signals").insert({
      from: currentUser,
      to: signal.from,
      type: "answer",
      data: peerConnection.localDescription
    });

    activeChatWith = signal.from;
    openChat(signal.from);

  } catch (err) {
    console.error("خطأ في قبول المكالمة:", err);
  }
}

// === ❌ إنهاء المكالمة ===
function endCall() {
  if (peerConnection) peerConnection.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  
  peerConnection = null;
  localStream = null;
  remoteStream = null;

  document.getElementById("videoCallOverlay").classList.add("hidden");
  document.getElementById("localVideo").srcObject = null;
  document.getElementById("remoteVideo").srcObject = null;
}

// === 🔄 استماع للتحديثات ===
function listenUsers() {
  db.channel('users_changes').on('postgres_changes', {
    event: '*', schema: 'public', table: 'users'
  }, () => loadUsers()).subscribe();
}

function listenMessages() {
  db.channel('messages_changes').on('postgres_changes', {
    event: 'INSERT', schema: 'public', table: 'messages'
  }, (payload) => {
    if (activeChatWith && 
        ((payload.new.from === currentUser && payload.new.to === activeChatWith) ||
         (payload.new.from === activeChatWith && payload.new.to === currentUser))) {
      loadMessages();
    }
  }).subscribe();
}

// === 🚀 تحميل الاسم المحفوظ ===
window.addEventListener('DOMContentLoaded', () => {
  const saved = getSavedUserName();
  if (saved) {
    document.getElementById("userNameInput").value = saved;
  }
});

// عند إغلاق الصفحة — تحديث الحالة
window.addEventListener('beforeunload', async () => {
  if (currentUser) {
    await db.from("users").upsert({ name: currentUser, online: false, last_seen: new Date().toISOString() });
  }
});
</script>
</body>
</html>
