<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل — الذكاء الاصطناعي</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    body{background:#0f1b2b;color:#fff;padding:20px;max-width:700px;margin:0 auto}
    .box{background:#1a2c42;border-radius:12px;padding:20px;margin-bottom:15px}
    input,textarea{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:#2a3c52;color:#fff;font-size:16px}
    button{background:#00c49a;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:8px}
    button:hover{background:#00b08a}
    .msg{padding:10px 14px;border-radius:10px;margin:8px 0;max-width:90%}
    .user{background:#1976d2;margin-left:auto}
    .ai{background:#2a3c52;margin-right:auto}
    .status{color:#00c49a;margin:10px 0}
    .warning{color:#ff9800}
    .error{color:#ff6b6b}
    .hidden{display:none}
  </style>
</head>
<body>

  <h1 style="text-align:center;margin-bottom:20px">🤖 تواصل — الذكاء الاصطناعي</h1>

  <!-- إدخال المفتاح -->
  <div id="keySection" class="box">
    <h3>🔑 أدخل مفتاحك</h3>
    <p style="color:#888;font-size:14px;margin:8px 0">المفتاح ما يطلع لحد غيرك ✅</p>
    <input type="password" id="apiKeyInput" placeholder="الصق مفتاح OpenRouter هنا...">
    <button onclick="saveKey()">✅ حفظ وبدء</button>
  </div>

  <!-- المحادثة -->
  <div id="chatSection" class="hidden">
    <div class="box">
      <div class="status">✅ جاهز — المفتاح محفوظ في تليفونك بس</div>
      <button style="background:#666; padding:8px; font-size:14px; width:auto" onclick="changeKey()">🔑 تغيير المفتاح</button>
    </div>
    <div class="box">
      <div id="chatArea" style="max-height:450px;overflow-y:auto;margin:10px 0"></div>
      <textarea id="userInput" rows="2" placeholder="اكتب سؤالك هنا..."></textarea>
      <button onclick="sendMessage()">🚀 إرسال</button>
    </div>
  </div>

<script>
let API_KEY = localStorage.getItem('openrouter_key') || '';

// لو المفتاح محفوظ نعرض المحادثة مباشرة
if(API_KEY){
  document.getElementById('keySection').classList.add('hidden');
  document.getElementById('chatSection').classList.remove('hidden');
}

function saveKey(){
  const key = document.getElementById('apiKeyInput').value.trim();
  if(!key) return alert('الصق المفتاح أولاً');
  API_KEY = key;
  localStorage.setItem('openrouter_key', key);
  document.getElementById('keySection').classList.add('hidden');
  document.getElementById('chatSection').classList.remove('hidden');
}

function changeKey(){
  localStorage.removeItem('openrouter_key');
  API_KEY = '';
  document.getElementById('chatSection').classList.add('hidden');
  document.getElementById('keySection').classList.remove('hidden');
  document.getElementById('apiKeyInput').value = '';
}

async function sendMessage(){
  if(!API_KEY) return alert('أدخل المفتاح أولاً');
  
  const input = document.getElementById('userInput');
  const chat = document.getElementById('chatArea');
  const text = input.value.trim();
  if(!text) return;

  chat.innerHTML += `<div class="msg user">أنت: ${text}</div>`;
  input.value = '';
  
  const loadingId = 'load-'+Date.now();
  chat.innerHTML += `<div class="msg ai" id="${loadingId}">جاري الرد...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try{
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: 'google/gemini-2.0-flash-exp:free',
        messages: [
          {role: 'system', content: 'أنت مساعد عربي، أجب ببساطة وباللهجة الليبية المبسطة.'},
          {role: 'user', content: text}
        ]
      })
    });

    const data = await res.json();
    document.getElementById(loadingId).remove();

    if(data.error) throw new Error(data.error.message || 'خطأ في الاتصال');
    
    const reply = data.choices[0].message.content || 'لم يتم الحصول على رد';
    chat.innerHTML += `<div class="msg ai">الذكاء: ${reply}</div>`;

  } catch(err){
    document.getElementById(loadingId).remove();
    chat.innerHTML += `<div class="msg ai error">❌ خطأ: ${err.message}</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
